project:
  type: book
  output-dir: ../docs/teaching

execute:
  freeze: auto   # CI has no R: computed chunks come from _freeze/, re-render locally after changing them

number-sections: true
number-depth: 3

book:
  title: "IMAG Teaching Materials"
  subtitle: "Playing the game: the decision flow, round by round"
  bread-crumbs: false
  chapters:
    - index.qmd
    - 01_round.qmd
    - 02_client.qmd
    - 03_market.qmd
    - 04_saa.qmd
    - 05_views.qmd
    - 06_taa.qmd
    - 07_securities.qmd
    - 08_submit.qmd
    - 09_results.qmd
  appendices:
    - a1_app.qmd
    - a2_roadmap.qmd
  page-footer:
    border: true
    center:
      - text: "<div class='imag-footer-wrap'><div class='imag-footer-logos'><img src='../assets/logos/uli.jpg' alt='University of Liechtenstein'><img src='../assets/logos/unibz.jpg' alt='unibz'><img src='../assets/logos/cesim.png' alt='Cesim'><img src='../assets/logos/erasmus.jpg' alt='Erasmus+'></div><p>© 2025 Investment Management Game (IMAG). All rights reserved.</p><p>Supported by <a href='https://erasmus-plus.ec.europa.eu/projects/search/details/2022-1-LI01-KA220-HED-000085536' target='_blank'>Erasmus+</a> and partner institutions.</p></div>"

format:
  html:
    theme: default
    css: custom.css
    toc: true
    number-sections: true
    number-depth: 3
    page-layout: full
    smooth-scroll: true
    anchor-sections: true
